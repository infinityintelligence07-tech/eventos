name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # Testes de integração: estrutura do GH (src/test/fixtures) + migrations do Eventos.
      # Postgres do próprio runner, e não um service container: a guarda de escrita exige que o
      # servidor responda no loopback, e um contêiner aparece com o IP da rede do Docker.
      - name: Postgres local
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h 127.0.0.1 -p 5432; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Migrations coerentes com os snapshots (offline, sem banco).
      - run: npm run db:check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run build
      # O worker não passa pelo build do Next: garante que as dependências dele carregam.
      - name: Worker carrega
        run: node -e "import('pg-boss')"

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha
